name: build and push image

on: 
    push: 
        branches: [ master ]

jobs: 
    build: 
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
    
        steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: setuo Node
          uses: actions/setup-node@v4
          with:
            node-version: '20'

        - name: Build frontend
          run: |
            npm install
            npm run build

        - name: login to github Container Registry
          uses: docker/login-action@v3
          with: 
            registry: ghcr.io
            username: ${{ github.actor }} 
            password: ${{ secrets.GITHUB_TOKEN }}
        
        - name: Build and push image
          uses: docker/build-push-action@v6
          with: 
            context: .
            push: true
            tags: ghcr.io/suntao2022/frontend-app:latest
            