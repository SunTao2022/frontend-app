apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: frontend-app
  namespace: monitoring
  labels:
    release: monitoring # ← 加这行！Prometheus 只认这个标签
spec:
  selector:
    matchLabels:
      app: frontend-app
  namespaceSelector:
    matchNames:
    - default
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
