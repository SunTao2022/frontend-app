apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: frontend-app
  template:
    metadata:
      labels:
        app: frontend-app
    spec:
      imagePullSecrets:
      - name: ghcr-secret

      containers:
      - name: frontend-app
        image: ghcr.io/suntao2022/frontend-app:e68e6dee83cbeee1ba410607229fa59e6a0892d7
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          protocol: TCP
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:1.4.2
        args:
        - "--nginx.scrape-uri=http://127.0.0.1:80/stub_status"
        ports:
        - name: metrics
          containerPort: 9113
          protocol: TCP
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-app
  labels:
    app: frontend-app
spec:
  selector:
    app: frontend-app
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 80
  - name: metrics
    protocol: TCP
    port: 9113
    targetPort: 9113
